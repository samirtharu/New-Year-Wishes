<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy New Year 2082 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Add Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Effects -->
  <div class="background-effects">
    <div class="bulb bulb-1"></div>
    <div class="bulb bulb-2"></div>
    <div class="bulb bulb-3"></div>
    <div class="bulb bulb-4"></div>
  </div>

  <div class="content">
    <h1 class="animate">🎉 Happy New Year 2082 🎉</h1>
    <p class="subtitle">Wishing you joy, success, and lots of love! Purnima 💖</p>
    <p>Enter your name to get a special wish:</p>
    
    <div class="input-container">
      <input type="text" id="nameInput" placeholder="Enter your Name" aria-label="Your name" autocomplete="name" autocapitalize="words">
      <button onclick="generateWish()" class="wish-button" id="wishButton" aria-label="Generate wish">Get Wish</button>
    </div>
    
    <div id="wish-output" class="wish-container" aria-live="polite"></div>
    
    <div class="copyright">
      &copy; 2025 Sameer Tharu. All rights reserved.
    </div>
  </div>

  <!-- Custom JavaScript to detect keyboard open -->
  <script>
    // Detect keyboard opening on mobile
    const originalHeight = window.innerHeight;
    window.addEventListener('resize', function() {
      if (window.innerHeight < originalHeight * 0.75) {
        document.body.classList.add('keyboard-open');
      } else {
        document.body.classList.remove('keyboard-open');
      }
    });
  </script>
  
  <!-- Main JavaScript -->
  <script src="script.js"></script>
</body>
</html>
